services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: travelagency
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pescao
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - travelagency-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 9090
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_PROXY: edge
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: pescao
    command: start-dev --import-realm
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/travelagency-realm-realm.json
    ports:
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - travelagency-net

  backend1:
    image: tinioviedo/travelagency-backend:latest
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: pescao
      KEYCLOAK_HOST: keycloak
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - travelagency-net

  backend2:
    image: tinioviedo/travelagency-backend:latest
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: pescao
      KEYCLOAK_HOST: keycloak
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - travelagency-net

  backend3:
    image: tinioviedo/travelagency-backend:latest
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: pescao
      KEYCLOAK_HOST: keycloak
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - travelagency-net

  nginx-backend:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx-backend.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "1427:80"
    depends_on:
      - backend1
    networks:
      - travelagency-net

  frontend1:
    image: tinioviedo/travelagency-frontend:latest
    networks:
      - travelagency-net

  frontend2:
    image: tinioviedo/travelagency-frontend:latest
    networks:
      - travelagency-net

  frontend3:
    image: tinioviedo/travelagency-frontend:latest
    networks:
      - travelagency-net

  nginx-frontend:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx-frontend.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8070:8070"
    depends_on:
      - frontend1
    networks:
      - travelagency-net

volumes:
  postgres_data:
  keycloak_data:

networks:
  travelagency-net:
