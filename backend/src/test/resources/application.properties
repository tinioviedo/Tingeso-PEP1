# Test configuration - uses H2 in-memory database (no PostgreSQL needed)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Keycloak JWT validation for tests (mocked in test classes)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9999/test
reservation.expiration-hours=24
