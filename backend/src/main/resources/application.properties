spring.application.name=travelagency-backend
server.port=1427
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/travelagency
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:pescao}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
reservation.expiration-hours=24
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://${KEYCLOAK_HOST:localhost}:9090/realms/travelagency-realm/protocol/openid-connect/certs