name: CI/CD Pipeline - TravelAgency

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ============================================================
  # JOB 1: Compilar el backend (falla rápido si no compila)
  # ============================================================
  build:
    name: Backend - Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build backend JAR (skip tests)
        run: mvn clean package -DskipTests --no-transfer-progress
        working-directory: backend

      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: travelagency-backend-jar
          path: backend/target/travelagency-backend.jar

  # ============================================================
  # JOB 2: Correr los tests unitarios (JUnit) — depende de build
  # ============================================================
  test:
    name: Backend - Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        run: mvn test --no-transfer-progress
        working-directory: backend

  # ============================================================
  # JOB 3: Construir la imagen Docker del backend — depende de test
  # ============================================================
  docker-build:
    name: Backend - Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: travelagency-backend-jar
          path: backend/target

      - name: Build backend Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/travelagency-backend:latest .
        working-directory: backend

      - name: Save Docker image as file
        run: docker save ${{ secrets.DOCKERHUB_USERNAME }}/travelagency-backend:latest -o backend-image.tar

      - name: Upload Docker image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: travelagency-backend-image
          path: backend-image.tar

  # ============================================================
  # JOB 4: Subir la imagen a Docker Hub — depende de docker-build
  # ============================================================
  docker-push:
    name: Backend - Docker Push
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: travelagency-backend-image
          path: .

      - name: Load Docker image
        run: docker load -i backend-image.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push backend image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/travelagency-backend:latest

  # ============================================================
  # JOB 5: Build Frontend and push image to Docker Hub
  # ============================================================
  frontend:
    name: Frontend - Build & Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build frontend Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/travelagency-frontend:latest .
        working-directory: frontend

      - name: Push frontend image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/travelagency-frontend:latest
